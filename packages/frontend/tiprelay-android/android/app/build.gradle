apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"
// Read only the four allowlisted public values; signing secrets never enter BuildConfig.
def configOutput = new ByteArrayOutputStream()
exec {
    commandLine "node", file("../../../../../scripts/android-config.mjs").absolutePath
    standardOutput = configOutput
}
def deployment = new groovy.json.JsonSlurper().parseText(configOutput.toString("UTF-8"))
react {
    reactNativeDir = file("../../../../../node_modules/react-native")
    hermesCommand = new File(reactNativeDir.get().asFile, "sdks/hermesc/%OS-BIN%/hermesc" +
        (System.getProperty("os.name").startsWith("Windows") ? ".exe" : "")).absolutePath
    codegenDir = file("../../../../../node_modules/@react-native/codegen")
    entryFile = file("../../index.js")
    cliFile = file(providers.exec {
        commandLine("node", "--print", "require.resolve('@expo/cli', {paths: [require.resolve('expo/package.json')]})")
    }.standardOutput.asText.get().trim())
    bundleCommand = "export:embed"
    debuggableVariants = ["debug"]
    autolinkLibrariesWithApp()
}
android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion
    namespace "com.tiprelaycompanion"
    externalNativeBuild {
        cmake {
            version "3.31.6"
        }
    }
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId "com.tiprelaycompanion"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        manifestPlaceholders = [appAuthRedirectScheme: "com.tiprelaycompanion"]
        versionCode 1
        versionName "0.1.0"
        buildConfigField "String", "API_URL", groovy.json.JsonOutput.toJson(deployment.apiUrl)
        buildConfigField "String", "COGNITO_DOMAIN", groovy.json.JsonOutput.toJson(deployment.cognitoDomain)
        buildConfigField "String", "MOBILE_CLIENT_ID", groovy.json.JsonOutput.toJson(deployment.mobileClientId)
        buildConfigField "String", "WEB_URL", groovy.json.JsonOutput.toJson(deployment.webUrl)
    }
    signingConfigs {
        release {
            if (System.getenv("TIPRELAY_KEYSTORE")) {
                storeFile file(System.getenv("TIPRELAY_KEYSTORE"))
                storePassword System.getenv("TIPRELAY_STORE_PASSWORD")
                keyAlias System.getenv("TIPRELAY_KEY_ALIAS")
                keyPassword System.getenv("TIPRELAY_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
        preview {
            initWith release
            signingConfig signingConfigs.debug
            minifyEnabled false
            matchingFallbacks = ['release']
        }
    }
}
tasks.configureEach { task ->
    if (task.name == "validateSigningRelease") {
        task.doFirst {
            if (deployment.stage != "production" || !deployment.apiUrl || !deployment.cognitoDomain || !deployment.mobileClientId || !deployment.webUrl) throw new GradleException("Release builds require production Android environment configuration")
            if (!System.getenv("TIPRELAY_KEYSTORE")) throw new GradleException("Release signing environment variables are required")
        }
    }
}
dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
    implementation("androidx.work:work-runtime-ktx:2.10.1")
    implementation("androidx.core:core-ktx:1.16.0")
    testImplementation("junit:junit:4.13.2")
}
